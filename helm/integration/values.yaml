# Default values for integration.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: registry.toc.systems
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# toc, gcp, azure
cloudType: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

frontendsvelte:
  image:
    name: fieldtwin-integration-frontendsvelte
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    annotations:
      # certmanager.k8s.io/cluster-issuer: "letsencrypt"
      kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    # hosts: []
    tls: []
  resources:
    requests:
      memory: "40Mi"
      cpu: "20m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  isEvaluation: false  

backend:
  image:
    name: fieldtwin-integration-backend
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    annotations:
      # certmanager.k8s.io/cluster-issuer: "letsencrypt"
      kubernetes.io/ingress.class: nginx
    # hosts: []
    tls: []
  resources:
    requests:
      memory: "40Mi"
      cpu: "20m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Default URL for logging to Sentry
  sentryDSN: ""
  # The FieldAP backend (of the integration backend)
  backendHostname: set-me.fieldap.com
  # The FieldAP front end (web app)
  frontendHostname: set-me.fieldap.com
  # Customise the backend logging level
  loggingLevel: ""