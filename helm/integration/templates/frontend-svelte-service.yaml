apiVersion: v1
kind: Service
metadata:
  name: {{ include "integration.frontendsvelte.fullname" . }}
  labels:
    {{- include "integration.frontendsvelte.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontendsvelte.service.type }}
  ports:
    - port: {{ .Values.frontendsvelte.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "integration.frontendsvelte.selectorLabels" . | nindent 4 }}
